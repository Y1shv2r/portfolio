<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Portfolio Content Manager</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#e8edf2;background:#0d1117}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0d1117}button,input,textarea{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;padding:28px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand h1{font-size:22px;margin:0}.brand p{color:#8b949e;margin:5px 0 0}.tabs{display:flex;gap:8px}.tabs button,.ghost,.danger,.primary{border:1px solid #30363d;background:#161b22;color:#e6edf3;border-radius:8px;padding:10px 14px}.tabs button.active,.primary{background:#238636;border-color:#2ea043}.grid{display:grid;grid-template-columns:330px 1fr;gap:18px}.panel{border:1px solid #30363d;background:#0f141b;border-radius:12px;overflow:hidden}.panel-head{padding:14px 16px;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;align-items:center}.list{max-height:calc(100vh - 190px);overflow:auto}.item{padding:14px 16px;border-bottom:1px solid #21262d;display:flex;justify-content:space-between;gap:12px}.item:hover{background:#161b22}.item.active{background:#1b222c}.item button{all:unset;cursor:pointer;flex:1}.item-title{font-weight:650}.item-meta{font-size:12px;color:#8b949e;margin-top:4px}.form{padding:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:16px}.field label{display:block;font-size:13px;color:#8b949e;margin-bottom:7px}.field input,.field textarea{width:100%;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:7px;padding:10px 11px;outline:none}.field textarea{min-height:105px;resize:vertical}.field input:focus,.field textarea:focus{border-color:#58a6ff}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}.tag{background:#21262d;border:1px solid #30363d;padding:5px 8px;border-radius:999px;font-size:12px}.tag button{border:0;background:none;color:#8b949e;padding:0 0 0 5px}.writing-toolbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}.writing-toolbar button{border:1px solid #30363d;background:#161b22;color:#e6edf3;border-radius:7px;padding:8px 11px}.writing-toolbar button:hover{border-color:#58a6ff}.writing-help{font-size:12px;color:#8b949e;margin:8px 0 10px;line-height:1.6}.writing-help code{color:#e6edf3;background:#161b22;padding:2px 5px;border-radius:4px}.body-editor{min-height:440px!important;line-height:1.65;resize:vertical;tab-size:2}.upload{border:1px dashed #484f58;border-radius:8px;padding:18px;color:#8b949e}.upload input{margin-top:8px}.uploaded{margin-top:10px;display:flex;flex-wrap:wrap;gap:7px}.file-chip{border:1px solid #30363d;background:#161b22;border-radius:6px;padding:6px 8px;font-size:12px;color:#c9d1d9}.actions{display:flex;gap:9px;justify-content:flex-end;padding-top:16px;border-top:1px solid #30363d;margin-top:20px}.status{margin:14px 0;padding:10px 12px;border-radius:7px;display:none}.status.ok{display:block;background:#0d2818;color:#7ee787}.status.err{display:block;background:#2d1114;color:#ff7b72}.hint{font-size:12px;color:#8b949e}.empty{padding:30px;color:#8b949e;text-align:center}.preview{border:1px solid #21262d;border-radius:8px;background:#0b0f14;padding:18px;margin-top:10px}.preview-title{font-size:12px;color:#8b949e;margin-bottom:10px}.preview p{white-space:pre-wrap;line-height:1.7;margin:0 0 12px;color:#c9d1d9}.preview .hl{background:#2d333b;border:1px solid #444c56;padding:1px 4px;border-radius:3px}.preview .copy{position:relative;background:#161b22;border:1px solid #30363d;border-radius:7px;padding:14px;margin:10px 0;font-family:ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap}.preview .copy button{position:absolute;top:7px;right:7px;border:1px solid #30363d;background:#0d1117;color:#c9d1d9;border-radius:5px;padding:4px 7px;font-size:11px}.preview .media{font-size:12px;color:#8b949e;border:1px dashed #30363d;padding:10px;margin:10px 0}@media(max-width:850px){.grid{grid-template-columns:1fr}.list{max-height:300px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand"><h1>Portfolio Content Manager</h1><p>Write projects and blogs naturally. The editor turns your syntax into the existing content blocks.</p></div><div class="tabs"><button id="projectsTab" class="active">Projects</button><button id="blogsTab">Blogs</button></div></div>
  <div class="grid">
    <section class="panel"><div class="panel-head"><strong id="listTitle">Projects</strong><button class="primary" id="newBtn">+ New</button></div><div id="list" class="list"></div></section>
    <section class="panel"><div id="editor" class="form"></div></section>
  </div>
</div>
<script>
let state={projects:[],blogs:[]}, section='projects', editing=null, draft=null;
const $=id=>document.getElementById(id);
async function api(url,opts={}){const r=await fetch(url,opts);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function clone(x){return JSON.parse(JSON.stringify(x||{}))}
function blocksToBody(blocks=[]){return blocks.map(b=>{if(b.type==='text')return b.content||'';if(b.type==='highlight')return `[${b.content||''}]`;if(b.type==='code')return `{[${b.content||''}]}`;if(b.type==='image')return `{{image:${b.src||''}${b.caption?`|${b.caption}`:''}}}`;if(b.type==='video')return `{{video:${b.src||''}${b.caption?`|${b.caption}`:''}}}`;if(b.type==='doc')return `{{doc:${b.src||''}${b.caption?`|${b.caption}`:''}}}`;return ''}).filter(Boolean).join('\n\n')}
async function load(){state=await api('/api/content');renderList();if(editing){const x=state[section].find(x=>x.slug===editing.slug);x?edit(editing.slug):newEntry()}else newEntry()}
function renderList(){$('listTitle').textContent=section==='projects'?'Projects':'Blogs';$('list').innerHTML=(state[section]||[]).length?state[section].map(x=>`<div class="item ${editing?.slug===x.slug?'active':''}"><button onclick="edit('${esc(x.slug)}')"><div class="item-title">${esc(x.title)}</div><div class="item-meta">${esc((x.tags||[]).join(' · '))}</div></button><button class="danger" style="padding:6px 9px" onclick="removeEntry('${esc(x.slug)}')">Delete</button></div>`).join(''):'<div class="empty">No content yet.</div>'}
function newEntry(){editing=null;draft={title:'',slug:'',date:'',startDate:'',endDate:'',tags:[],description:'',body:'',blocks:[]};renderList();renderEditor()}
function edit(slug){editing={slug};const x=state[section].find(x=>x.slug===slug);draft=clone(x);draft.body=(x.body!==undefined?x.body:blocksToBody(x.blocks||[]));renderList();renderEditor()}
function renderEditor(){const d=draft; $('editor').innerHTML=`<div class="row"><div class="field"><label>Title</label><input id="title" value="${esc(d.title)}" placeholder="Title"></div><div class="field"><label>Slug</label><input id="slug" value="${esc(d.slug)}" placeholder="auto-generated if blank"></div></div><div class="row"><div class="field"><label>Date / Start date</label><input id="startDate" value="${esc(d.startDate||d.date)}" placeholder="2026-09"></div><div class="field"><label>End date</label><input id="endDate" value="${esc(d.endDate)}" placeholder="Leave blank for ongoing"></div></div><div class="field"><label>Tags — press Enter after each tag</label><input id="tagInput" placeholder="ROS2, Python, OpenCV..."><div class="tags" id="tags">${(d.tags||[]).map((t,i)=>`<span class="tag">${esc(t)} <button onclick="removeTag(${i})">×</button></span>`).join('')}</div></div><div class="field"><label>Short description</label><textarea id="description" placeholder="Shown in the project/blog listing">${esc(d.description)}</textarea></div><div class="field"><label>Write your ${section==='blogs'?'blog':'project'} here</label><div class="writing-toolbar"><button type="button" onclick="wrapSelection('[',']')">Highlight [ ]</button><button type="button" onclick="wrapSelection('{[',']}')">Copy block {[ ]}</button><button type="button" onclick="insertMedia('image')">Insert image</button><button type="button" onclick="insertMedia('video')">Insert video</button><button type="button" onclick="insertMedia('doc')">Insert document</button><button type="button" onclick="insertText('\n\n')">Paragraph</button></div><div class="writing-help"><code>[important text]</code> becomes highlighted. <code>{[code or command]}</code> becomes a copyable code block. Media uses <code>{{image:filename}}</code> after upload.</div><textarea id="body" class="body-editor" placeholder="Start writing...\n\nUse [square brackets] for highlighted text.\nUse {[square brackets inside braces]} for copyable code.">${esc(d.body)}</textarea><div class="preview"><div class="preview-title">Preview</div><div id="previewContent"></div></div></div><div class="field"><label>Upload files</label><div class="upload">Upload images, videos or documents into this content folder.<br><input id="files" type="file" multiple accept="image/*,video/*,.pdf,.txt,.md,.doc,.docx"><div id="uploaded" class="uploaded"></div></div><div class="hint">After uploading, click the Insert image/video/document button and enter/select the filename.</div></div><div id="status" class="status"></div><div class="actions"><button class="ghost" onclick="newEntry()">Clear</button><button class="primary" onclick="save()">Save ${editing?'Changes':'Content'}</button><button class="primary" onclick="saveAndCommit()">Save + Commit</button></div>`;
['title','slug','startDate','endDate','description','body'].forEach(id=>$(id).addEventListener('input',e=>{draft[id]=e.target.value;if(id==='startDate')draft.date=e.target.value;if(id==='body')renderPreview()}));
$('tagInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const v=e.target.value.trim();if(v){draft.tags=[...(draft.tags||[]),v];e.target.value='';renderEditor();focusBody()}}});$('files').addEventListener('change',showSelectedFiles);renderPreview()}
function focusBody(){setTimeout(()=>{const b=$('body');if(b)b.focus()},0)}
function removeTag(i){draft.tags.splice(i,1);renderEditor()}
function wrapSelection(a,b){const ta=$('body');if(!ta)return;const s=ta.selectionStart,e=ta.selectionEnd,selected=ta.value.slice(s,e);ta.setRangeText(a+selected+b,s,e,'select');draft.body=ta.value;renderPreview();ta.focus()}
function insertText(text){const ta=$('body');const s=ta.selectionStart,e=ta.selectionEnd;ta.setRangeText(text,s,e,'end');draft.body=ta.value;renderPreview();ta.focus()}
function insertMedia(type){const name=prompt(`Enter the uploaded filename for this ${type}:`);if(!name)return;const caption=prompt('Caption (optional):')||'';const token=`{{${type}:${name}${caption?`|${caption}`:''}}}`;insertText(`\n\n${token}\n\n`)}
function showSelectedFiles(){const files=[...$('files').files];$('uploaded').innerHTML=files.map(f=>`<span class="file-chip">${esc(f.name)}</span>`).join('')}
function renderPreview(){const host=$('previewContent');if(!host||!draft)return;host.innerHTML='';const blocks=parseBody(draft.body||'');blocks.forEach(b=>{if(b.type==='text'){const p=document.createElement('p');p.textContent=b.content;host.appendChild(p)}else if(b.type==='highlight'){const p=document.createElement('p');const s=document.createElement('span');s.className='hl';s.textContent=b.content;p.appendChild(s);host.appendChild(p)}else if(b.type==='code'){const pre=document.createElement('div');pre.className='copy';pre.textContent=b.content;const btn=document.createElement('button');btn.textContent='Copy';btn.onclick=()=>navigator.clipboard?.writeText(b.content);pre.appendChild(btn);host.appendChild(pre)}else{const m=document.createElement('div');m.className='media';m.textContent=`${b.type}: ${b.src}`;host.appendChild(m)}})}
function parseBody(body){const out=[];let i=0,text='';function flush(){if(text){out.push({type:'text',content:text});text=''}}while(i<body.length){if(body.startsWith('{{image:',i)||body.startsWith('{{video:',i)||body.startsWith('{{doc:',i)){flush();const end=body.indexOf('}}',i+2);if(end!==-1){const inner=body.slice(i+2,end);const [kind,...rest]=inner.split(':');const val=rest.join(':');const [src,...cap]=val.split('|');out.push({type:kind,src:src.trim(),caption:cap.join('|').trim()});i=end+2;continue}}}if(body.startsWith('{[',i)){flush();const end=body.indexOf(']}',i+2);if(end!==-1){out.push({type:'code',content:body.slice(i+2,end)});i=end+2;continue}}if(body[i]==='['){const end=body.indexOf(']',i+1);if(end!==-1){flush();out.push({type:'highlight',content:body.slice(i+1,end)});i=end+1;continue}}text+=body[i];i++}flush();return out}
async function uploadFiles(slug){const files=[...($('files')?.files||[])];for(const file of files){const fd=new FormData();fd.append('file',file);await api(`/api/content/${section}/${encodeURIComponent(slug)}/upload`,{method:'POST',body:fd})}}
async function save(commit=false){try{const x={...draft,title:$("title").value,slug:$("slug").value,startDate:$("startDate").value,endDate:$("endDate").value,date:$("startDate").value,description:$("description").value,body:$("body").value,tags:[...(draft.tags||[]) ]};if(!x.title.trim())throw new Error('Title is required');await uploadFiles((x.slug||x.title));const result=await api(`/api/content/${section}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)});state=result.content;editing={slug:result.slug};draft=clone(state[section].find(y=>y.slug===result.slug));draft.body=x.body;showStatus('Saved successfully.');renderList();renderEditor();if(commit)await commitOnly()}catch(e){showStatus(e.message,true)}}
async function commitOnly(){try{await api('/api/git/commit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:`Update ${section}: ${editing?.slug||'content'}`})});showStatus('Saved and committed. Push to GitHub to deploy.')}catch(e){showStatus(e.message,true)}}
async function saveAndCommit(){await save(true)}
async function removeEntry(slug){if(!confirm(`Delete ${slug}? This removes its folder and media files.`))return;try{const r=await api(`/api/content/${section}/${encodeURIComponent(slug)}`,{method:'DELETE'});state=r.content;editing=null;newEntry()}catch(e){showStatus(e.message,true)}}
function showStatus(msg,err=false){const s=$('status');if(!s)return;s.textContent=msg;s.className='status '+(err?'err':'ok');setTimeout(()=>s.className='status',5000)}
$('projectsTab').onclick=()=>{section='projects';editing=null;$('projectsTab').classList.add('active');$('blogsTab').classList.remove('active');load()};$('blogsTab').onclick=()=>{section='blogs';editing=null;$('blogsTab').classList.add('active');$('projectsTab').classList.remove('active');load()};$('newBtn').onclick=newEntry;load();
</script>
</body></html>
