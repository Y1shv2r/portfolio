<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>Yash Vardhan Kumar | Embedded &amp; Robotics Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080808;
  --bg2: #0e0e0e;
  --bg3: #141414;
  --text: #e2e2e2;
  --text-dim: #666;
  --text-muted: #333;
  --border: #1e1e1e;
  --accent: #b0b0b0;
  --prompt: #555;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace;
  font-size: 13px;
  line-height: 1.7;
}

/* grain */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity: 0.04;
  pointer-events: none;
  z-index: 9999;
}

/* pcb grid */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.01) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.01) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
  z-index: 0;
}

/* ── TITLEBAR ── */
#titlebar {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  user-select: none;
  position: relative;
  z-index: 10;
}
.dots { display: flex; gap: 7px; }
.dot { width: 11px; height: 11px; border-radius: 50%; background: #1a1a1a; border: 1px solid #252525; }
.ttitle { font-size: 11px; color: #383838; letter-spacing: 0.12em; text-transform: uppercase; }
.tbadge { font-size: 10px; color: #2a2a2a; letter-spacing: 0.08em; }

/* ── LAYOUT ── */
#terminal-wrap { 
  height: 100vh; 
  display: flex; 
  flex-direction: column; 
  position: relative; 
  z-index: 1;
  overflow: hidden;
}
#term-body { flex: 1; display: flex; overflow: hidden; }

/* ── OUTPUT ── */
#output {
  flex: 1;
  overflow-y: auto;
  overflow-x: auto;
  padding: 22px 28px 8px;
  scrollbar-width: thin;
  scrollbar-color: #1e1e1e transparent;
}
#output::-webkit-scrollbar { width: 3px; height: 3px; }
#output::-webkit-scrollbar-track { background: transparent; }
#output::-webkit-scrollbar-thumb { background: #1e1e1e; border-radius: 2px; }

/* ── PORTRAIT PANEL ── */
#portrait-panel {
  width: 300px;
  flex-shrink: 0;
  border-left: 1px solid #111;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 0;
  overflow-y: auto;
  position: relative;
  background: var(--bg);
}
#portrait-img {
  width: 100%;
  height: auto;
  object-fit: cover;
  object-position: center top;
  display: block;
  mix-blend-mode: luminosity;
  opacity: 0.75;
  filter: contrast(1.1) brightness(0.9);
  flex-shrink: 0;
}
.portrait-info { width: 100%; padding: 14px 16px 16px; border-top: 1px solid #111; background: var(--bg); }
.pi-name { font-size: 10px; color: #666; letter-spacing: 0.12em; line-height: 2; }
.pi-val  { font-size: 11px; color: #999; letter-spacing: 0.05em; }

/* ── TERMINAL TEXT ── */
.line { display: block; white-space: pre-wrap; word-break: break-word; }
.line.empty { height: 1.7em; }
.prompt-line { display: flex; align-items: flex-start; flex-wrap: wrap; }
.prompt-text { color: var(--prompt); white-space: pre; flex-shrink: 0; }
.cmd-echo    { color: var(--text); word-break: break-all; }
.output-text { color: var(--text-dim); }
.output-text.bright { color: var(--text); }
.output-text.dim    { color: var(--text-muted); }
.output-text.error  { color: #444; }
.section-head { color: var(--accent); font-weight: 500; letter-spacing: 0.04em; }
.tag { display: inline-block; border: 1px solid #1e1e1e; padding: 0 6px; font-size: 11px; color: #3a3a3a; margin-right: 5px; margin-bottom: 2px; }
.dir-entry  { display: inline-block; min-width: 180px; color: var(--accent); cursor: pointer; }
.file-entry { display: inline-block; min-width: 180px; color: var(--text-dim); cursor: pointer; }
.divider { border: none; border-top: 1px solid #161616; margin: 10px 0; }
.card { border: 1px solid #161616; padding: 12px 16px; margin: 4px 0; background: #0b0b0b; max-width: 500px; cursor: pointer; transition: border-color 0.15s; }
.card:hover { border-color: #2a2a2a; }
.card-title { color: var(--accent); font-weight: 500; margin-bottom: 4px; }
.card-meta  { color: #2e2e2e; font-size: 11px; margin-bottom: 6px; }
.card-desc  { color: var(--text-dim); font-size: 12px; }
.welcome-ascii { 
  font-size: 10px; 
  line-height: 1.25; 
  color: #555; 
  white-space: pre !important;
  overflow-x: auto; 
  display: block;
  min-width: max-content;
  word-break: normal !important;
}

/* ── INPUT ── */
#input-row {
  display: flex;
  align-items: center;
  padding: 10px 28px 10px;
  border-top: 1px solid #111;
  background: var(--bg);
  flex-shrink: 0;
  position: relative;
  z-index: 10;
  flex-wrap: wrap;
  gap: 8px;
  min-height: 40px;
}
#prompt-label { color: var(--prompt); white-space: pre; flex-shrink: 0; font-family: inherit; font-size: 13px; }
#cmd-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: inherit;
  font-size: 16px;
  caret-color: var(--text);
  min-width: 120px;
}

/* ── COMMAND BUTTONS ── */
#command-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 8px 28px 12px;
  background: var(--bg);
  flex-shrink: 0;
  min-height: 40px;
}
#command-buttons button {
  background: #0e0e0e;
  border: 1px solid #1e1e1e;
  color: #666;
  padding: 8px 16px;
  border-radius: 0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.1s;
  min-height: 36px;
  -webkit-tap-highlight-color: transparent;
}
#command-buttons button:hover { background: #161616; color: #aaa; }

/* ── SUGGESTION BAR ── */
#suggestion-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 6px 28px 0 28px;
  background: var(--bg);
  flex-shrink: 0;
  min-height: 32px;
}
#suggestion-bar span {
  background: #0e0e0e;
  border: 1px solid #1e1e1e;
  color: #555;
  padding: 4px 12px;
  font-size: 10px;
  font-family: monospace;
  cursor: pointer;
  transition: all 0.1s;
  -webkit-tap-highlight-color: transparent;
  min-height: 32px;
  display: inline-flex;
  align-items: center;
}
#suggestion-bar span:hover { background: #161616; color: #888; }

/* ── CLICKABLE ENTRIES ── */
.dir-entry:hover, .file-entry:hover { color: #ccc; }

/* ── STATUSBAR ── */
#statusbar {
  position: fixed;
  bottom: 0; right: 0;
  z-index: 9999;
  background: var(--bg2);
  border-top: 1px solid #111;
  border-left: 1px solid #111;
  padding: 3px 14px;
  font-size: 10px;
  color: #252525;
  letter-spacing: 0.1em;
  font-family: 'JetBrains Mono', monospace;
  pointer-events: none;
}

::selection { background: #222; color: var(--text); }

/* ── SOCIAL BUTTONS ── */
.social-btns { display: flex; gap: 0; width: 100%; border-top: 1px solid #111; flex-shrink: 0; }
.social-btn {
  flex: 1;
  background: transparent;
  border: none;
  border-right: 1px solid #111;
  padding: 10px 0;
  cursor: pointer;
  color: #333;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  transition: background 0.15s, color 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
}
.social-btn:last-child { border-right: none; }
.social-btn:hover { background: #111; color: #888; }
.social-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* ── RESUME BUTTON ── */
.resume-btn {
  width: 100%;
  background: transparent;
  border: none;
  border-top: 1px solid #111;
  padding: 10px 0;
  cursor: pointer;
  color: #444;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.06em;
  transition: background 0.15s, color 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-shrink: 0;
}
.resume-btn:hover { background: #111; color: #888; }

/* ── RESUME OVERLAY ── */
#resume-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.96);
  z-index: 2000;
  display: none;
  flex-direction: column;
  font-family: 'JetBrains Mono', monospace;
}
#resume-overlay.active { display: flex; }
.rv-topbar {
  background: #0e0e0e;
  border-bottom: 1px solid #1e1e1e;
  padding: 8px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #444;
  font-size: 11px;
  flex-shrink: 0;
  flex-wrap: wrap;
  gap: 10px;
}
.rv-topbar-right { display: flex; gap: 16px; align-items: center; }
.rv-dl-btn {
  background: #161616; border: 1px solid #1e1e1e; color: #666;
  padding: 4px 12px; cursor: pointer; font-family: inherit; font-size: 11px;
  letter-spacing: 0.06em; transition: background 0.15s, color 0.15s;
}
.rv-dl-btn:hover { background: #222; color: #aaa; }
.rv-close-btn {
  background: transparent; border: none; color: #333; cursor: pointer;
  font-family: inherit; font-size: 11px; letter-spacing: 0.06em; padding: 4px 8px;
}
.rv-close-btn:hover { color: #888; }
.rv-body { flex: 1; overflow: auto; display: flex; align-items: flex-start; justify-content: center; padding: 32px 24px; }
.rv-img { max-width: 100%; max-height: none; border: 1px solid #1e1e1e; }
.rv-botbar {
  background: #0e0e0e; border-top: 1px solid #1e1e1e;
  padding: 6px 16px; font-size: 10px; color: #252525;
  letter-spacing: 0.1em; display: flex; gap: 24px; flex-shrink: 0; flex-wrap: wrap;
}

/* ── BLOCK RENDERER ── */
.block-text {
  color: var(--text-dim);
  font-size: 12px;
  line-height: 1.9;
  max-width: 640px;
  white-space: pre-wrap;
  word-break: break-word;
}
.block-image { max-width: 640px; border: 1px solid #1e1e1e; background: #0b0b0b; overflow: hidden; }
.block-image img { width: 100%; height: auto; display: block; mix-blend-mode: luminosity; opacity: 0.85; filter: contrast(1.05); transition: opacity 0.2s; }
.block-image img:hover { opacity: 1; }
.block-video { max-width: 640px; border: 1px solid #1e1e1e; background: #080808; overflow: hidden; }
.block-video video { width: 100%; display: block; background: #000; }
.block-caption { font-size: 10px; color: #2e2e2e; padding: 6px 10px; border-top: 1px solid #111; letter-spacing: 0.06em; }
.block-doc {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  border: 1px solid #1e1e1e;
  background: #0b0b0b;
  padding: 10px 16px;
  text-decoration: none;
  color: var(--text-dim);
  max-width: 400px;
  transition: background 0.15s, border-color 0.15s;
}
.block-doc:hover { background: #141414; border-color: #2a2a2a; color: var(--text); }
.block-doc-icon  { color: #3a3a3a; flex-shrink: 0; display: flex; align-items: center; }
.block-doc-name  { font-size: 11px; color: var(--accent); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.block-doc-caption { font-size: 10px; color: #2a2a2a; flex-shrink: 0; }
.block-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  max-width: 640px;
  height: 120px;
  border: 1px dashed #1a1a1a;
  background: #0a0a0a;
}
.ph-icon  { font-size: 24px; color: #1e1e1e; }
.ph-label { font-size: 11px; color: #2e2e2e; }
.ph-hint  { font-size: 10px; color: #1e1e1e; font-style: italic; }

/* ── RESPONSIVE ── */
@media (max-width: 900px) {
  #portrait-panel { display: none; }
  #output { padding: 16px; }
}

/* ── MOBILE: scrollable page layout ── */
@media (max-width: 768px) {
  /* Full scrollable page */
  html, body { height: auto; overflow: auto; }
  #terminal-wrap { height: auto; min-height: 100dvh; overflow: visible; display: flex; flex-direction: column; }
  #term-body { flex-direction: column; overflow: visible; flex: none; }

  /* Portrait panel full-width, fully visible */
  #portrait-panel {
    display: flex !important;
    width: 100% !important;
    flex-direction: column;
    border-left: none;
    border-bottom: 1px solid #111;
    overflow: visible;
    flex-shrink: 0;
  }
  #portrait-img {
    width: 100%;
    height: auto;
    max-height: none;
    object-fit: cover;
    object-position: center top;
  }
  .portrait-info { padding: 12px 16px; }

  /* Hide terminal output, input, suggestions */
  #output { display: none !important; }
  #input-row { display: none !important; }
  #suggestion-bar { display: none !important; }

  /* Command buttons — 3 per row */
  #command-buttons {
    padding: 12px 16px 12px;
    gap: 10px;
    border-top: 1px solid #111;
  }
  #command-buttons button {
    padding: 10px 16px;
    font-size: 11px;
    min-height: 44px;
    flex: 1 1 calc(33% - 10px);
  }
  #command-buttons button.active {
    background: #161616;
    color: #aaa;
    border-color: #2a2a2a;
  }

  /* Mobile content area — renders below buttons */
  #mobile-content {
    padding: 0 16px 40px;
    min-height: 0;
  }
  #mobile-content .m-section-head {
    color: #b0b0b0;
    font-size: 13px;
    font-weight: 500;
    padding: 18px 0 10px;
    border-bottom: 1px solid #161616;
    margin-bottom: 12px;
    letter-spacing: 0.04em;
  }
  #mobile-content .m-text {
    color: #555;
    font-size: 12px;
    line-height: 1.9;
    margin-bottom: 6px;
  }
  #mobile-content .m-text.bright { color: #e2e2e2; }
  #mobile-content .m-card {
    border: 1px solid #1a1a1a;
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    background: #0b0b0b;
    transition: border-color 0.15s;
  }
  #mobile-content .m-card:active { border-color: #2a2a2a; }
  #mobile-content .m-card-title { color: #b0b0b0; font-size: 13px; font-weight: 500; margin-bottom: 4px; }
  #mobile-content .m-card-meta  { color: #2e2e2e; font-size: 11px; margin-bottom: 6px; }
  #mobile-content .m-card-desc  { color: #555; font-size: 12px; }
  #mobile-content .m-skill-cat  { color: #e2e2e2; font-size: 12px; margin-top: 14px; margin-bottom: 3px; }
  #mobile-content .m-skill-items { color: #444; font-size: 12px; padding-left: 10px; line-height: 1.8; }
  #mobile-content .m-help-row {
    display: flex; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid #111;
    color: #555; font-size: 12px;
  }
  #mobile-content .m-help-row span:first-child { color: #888; }
}
@media (max-height: 500px) and (orientation: landscape) {
  #portrait-panel { display: none !important; }
  #output { display: block !important; padding: 8px 12px; }
  #input-row { display: flex !important; }
  .welcome-ascii { font-size: 6px; white-space: pre !important; overflow-x: auto; min-width: max-content; }
  .line.empty { height: 1.2em; }
}
.welcome-ascii { overflow-x: auto; white-space: pre !important; min-width: max-content; word-break: normal !important; }
</style>
</head>
<body>

  <div id="titlebar">

    <div class="ttitle">yash@portfolio — terminal</div>

  <div id="term-body">

  </div>

  <!-- SUGGESTION BAR - MOVED OUTSIDE PORTRAIT PANEL -->

  <!-- COMMAND BUTTONS - MOVED OUTSIDE PORTRAIT PANEL -->
  <div id="command-buttons"></div>

  <!-- MOBILE CONTENT AREA -->
  <div id="mobile-content"></div>
</div>

<div id="statusbar">RW &nbsp;·&nbsp; UTF-8 &nbsp;·&nbsp; <span id="clock"></span></div>

<!-- Resume overlay -->

  <div class="rv-topbar">
    <span>// resume.pdf</span>

      <button class="rv-dl-btn" onclick="downloadResume()">⬇ download</button>
      <button class="rv-close-btn" onclick="closeResume()">✕ close</button>

</div>
