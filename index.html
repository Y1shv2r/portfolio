<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>Yash Vardhan Kumar | Embedded &amp; Robotics Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080808;
  --bg2: #0e0e0e;
  --bg3: #141414;
  --text: #e2e2e2;
  --text-dim: #666;
  --text-muted: #333;
  --border: #1e1e1e;
  --accent: #b0b0b0;
  --prompt: #555;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  overflow-x: hidden;
  overflow-y: auto;
  background: var(--bg);
  color: var(--text);
  font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace;
  font-size: 13px;
  line-height: 1.7;
}

/* grain */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity: 0.04;
  pointer-events: none;
  z-index: 9999;
}

/* pcb grid */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.01) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.01) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
  z-index: 0;
}

/* ── LAYOUT ── */
#terminal-wrap { 
  height: 100vh; 
  display: flex; 
  flex-direction: column; 
  position: relative; 
  z-index: 1;
  overflow: hidden;
}
#term-body { flex: 1; display: flex; overflow: hidden; min-height: 0; }

/* ── OUTPUT ── */
#output {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: auto;
  /*
   * The command prompt + navigation/social controls are an open
   * terminal footer positioned over the bottom of the viewport.
   * Reserve space for them so command output can never disappear
   * underneath the footer.
   */
  padding: 22px 28px 180px;
  box-sizing: border-box;
  scrollbar-width: thin;
  scrollbar-color: #1e1e1e transparent;
}
#output::-webkit-scrollbar { width: 3px; height: 3px; }
#output::-webkit-scrollbar-track { background: transparent; }
#output::-webkit-scrollbar-thumb { background: #1e1e1e; border-radius: 2px; }

/* ── TERMINAL TEXT ── */
.line { display: block; white-space: pre-wrap; word-break: break-word; }
.line.empty { height: 1.7em; }
.prompt-line { display: flex; align-items: flex-start; flex-wrap: wrap; }
.prompt-text { color: var(--prompt); white-space: pre; flex-shrink: 0; }
.cmd-echo    { color: var(--text); word-break: break-all; }
.output-text { color: var(--text-dim); }
.output-text.bright { color: var(--text); }
.output-text.dim    { color: var(--text-muted); }
.output-text.error  { color: #444; }
.section-head { color: var(--accent); font-weight: 500; letter-spacing: 0.04em; }
.tag { display: inline-block; border: 1px solid #1e1e1e; padding: 0 6px; font-size: 11px; color: #3a3a3a; margin-right: 5px; margin-bottom: 2px; }
.dir-entry  { display: inline-block; min-width: 180px; color: var(--accent); cursor: pointer; }
.file-entry { display: inline-block; min-width: 180px; color: var(--text-dim); cursor: pointer; }
.divider { border: none; border-top: 1px solid #161616; margin: 10px 0; }
.card { border: 1px solid #161616; padding: 12px 16px; margin: 4px 0; background: #0b0b0b; max-width: 500px; cursor: pointer; transition: border-color 0.15s; }
.card:hover { border-color: #2a2a2a; }
.card-title { color: var(--accent); font-weight: 500; margin-bottom: 4px; }
.card-meta  { color: #2e2e2e; font-size: 11px; margin-bottom: 6px; }
.card-desc  { color: var(--text-dim); font-size: 12px; }
.welcome-ascii { 
  font-size: 10px; 
  line-height: 1.25; 
  color: #555; 
  white-space: pre !important;
  overflow-x: auto; 
  display: block;
  min-width: max-content;
  word-break: normal !important;
}

/* ── OPEN TERMINAL FOOTER ── */
#terminal-footer {
  position: absolute;
  left: 24px; right: 24px; bottom: 24px;
  z-index: 20;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  pointer-events: none;
}
#footer-left, #footer-right { pointer-events: auto; }
#footer-left { min-width: 0; flex: 1; }
#footer-right { width: 244px; flex: 0 0 244px; }

#input-row {
  display: flex;
  align-items: center;
  padding: 0 0 14px;
  background: transparent;
  border: none;
  min-height: 0;
  gap: 0;
}
#prompt-label {
  color: #777;
  white-space: pre;
  flex-shrink: 0;
  font-family: inherit;
  font-size: 13px;
}
#cmd-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: inherit;
  font-size: 16px;
  caret-color: #aaa;
  min-width: 80px;
  padding: 0;
}

#command-buttons {
  display: flex !important;
  flex-wrap: wrap;
  gap: 8px;
  padding: 0;
  background: transparent;
  min-height: 36px;
  visibility: visible !important;
  opacity: 1 !important;
}
#command-buttons button {
  background: rgba(5,6,8,.26);
  border: 1px solid rgba(220,220,220,.20);
  color: #9a9a9a;
  padding: 9px 16px;
  border-radius: 0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  cursor: pointer;
  transition: background .15s, color .15s, border-color .15s;
  min-height: 36px;
  -webkit-tap-highlight-color: transparent;
}
#command-buttons button:hover, #command-buttons button.active {
  background: rgba(20,20,20,.48);
  color: #ddd;
  border-color: rgba(220,220,220,.38);
}

#suggestion-bar {
  position: absolute; left: 24px; bottom: 88px;
  display: flex; flex-wrap: wrap; gap: 6px;
  padding: 0; background: transparent; z-index: 21;
}
#suggestion-bar span {
  background: rgba(5,6,8,.42);
  border: 1px solid rgba(220,220,220,.16);
  color: #777; padding: 4px 10px; font-size: 10px;
  font-family: monospace; cursor: pointer; min-height: 28px;
  display: inline-flex; align-items: center;
}
#suggestion-bar span:hover { background: rgba(20,20,20,.55); color: #aaa; }

/* ── SOCIAL / RESUME FOOTER ── */
.social-btns {
  display: flex; width: 100%; height: 48px;
  border: 1px solid rgba(220,220,220,.20);
}
.social-btn {
  flex: 1; background: rgba(5,6,8,.26);
  border: none; border-right: 1px solid rgba(220,220,220,.16);
  padding: 0; cursor: pointer; color: #999;
  display: flex; align-items: center; justify-content: center;
  text-decoration: none; transition: background .15s, color .15s;
}
.social-btn:last-child { border-right: none; }
.social-btn:hover { background: rgba(20,20,20,.55); color: #ddd; }
.social-btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.resume-btn {
  width: 100%; height: 44px; margin-top: 8px;
  background: rgba(5,6,8,.26);
  border: 1px solid rgba(220,220,220,.20);
  padding: 0; cursor: pointer; color: #999;
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  letter-spacing: .06em; transition: background .15s, color .15s, border-color .15s;
  display: flex; align-items: center; justify-content: center;
}
.resume-btn:hover { background: rgba(20,20,20,.55); color: #ddd; border-color: rgba(220,220,220,.38); }

/* ── RESUME OVERLAY ── */
#resume-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.96);
  z-index: 2000;
  display: none;
  flex-direction: column;
  font-family: 'JetBrains Mono', monospace;
}
#resume-overlay.active { display: flex; }
.rv-topbar {
  background: #0e0e0e;
  border-bottom: 1px solid #1e1e1e;
  padding: 8px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #444;
  font-size: 11px;
  flex-shrink: 0;
  flex-wrap: wrap;
  gap: 10px;
}
.rv-topbar-right { display: flex; gap: 16px; align-items: center; }
.rv-dl-btn {
  background: #161616; border: 1px solid #1e1e1e; color: #666;
  padding: 4px 12px; cursor: pointer; font-family: inherit; font-size: 11px;
  letter-spacing: 0.06em; transition: background 0.15s, color 0.15s;
}
.rv-dl-btn:hover { background: #222; color: #aaa; }
.rv-close-btn {
  background: transparent; border: none; color: #333; cursor: pointer;
  font-family: inherit; font-size: 11px; letter-spacing: 0.06em; padding: 4px 8px;
}
.rv-close-btn:hover { color: #888; }
.rv-body {
  flex: 1;
  overflow: hidden;
  padding: 0;
}

.rv-img {
  width: 100%;
  height: 100%;
  border: none;
}
.rv-botbar {
  background: #0e0e0e; border-top: 1px solid #1e1e1e;
  padding: 6px 16px; font-size: 10px; color: #252525;
  letter-spacing: 0.1em; display: flex; gap: 24px; flex-shrink: 0; flex-wrap: wrap;
}

/* ── BLOCK RENDERER ── */
.block-text {
  color: var(--text-dim);
  font-size: 12px;
  line-height: 1.9;
  max-width: 640px;
  white-space: pre-wrap;
  word-break: break-word;
}
.block-image { max-width: 640px; border: 1px solid #1e1e1e; background: #0b0b0b; overflow: hidden; }
.block-image img { width: 100%; height: auto; display: block; mix-blend-mode: luminosity; opacity: 0.85; filter: contrast(1.05); transition: opacity 0.2s; }
.block-image img:hover { opacity: 1; }
.block-video { max-width: 640px; border: 1px solid #1e1e1e; background: #080808; overflow: hidden; }
.block-video video { width: 100%; display: block; background: #000; }
.block-caption { font-size: 10px; color: #2e2e2e; padding: 6px 10px; border-top: 1px solid #111; letter-spacing: 0.06em; }
.block-doc {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  border: 1px solid #1e1e1e;
  background: #0b0b0b;
  padding: 10px 16px;
  text-decoration: none;
  color: var(--text-dim);
  max-width: 400px;
  transition: background 0.15s, border-color 0.15s;
}
.block-doc:hover { background: #141414; border-color: #2a2a2a; color: var(--text); }
.block-doc-icon  { color: #3a3a3a; flex-shrink: 0; display: flex; align-items: center; }
.block-doc-name  { font-size: 11px; color: var(--accent); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.block-doc-caption { font-size: 10px; color: #2a2a2a; flex-shrink: 0; }
.block-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  max-width: 640px;
  height: 120px;
  border: 1px dashed #1a1a1a;
  background: #0a0a0a;
}
.ph-icon  { font-size: 24px; color: #1e1e1e; }
.ph-label { font-size: 11px; color: #2e2e2e; }
.ph-hint  { font-size: 10px; color: #1e1e1e; font-style: italic; }

/* ── RESPONSIVE ── */
@media (max-width: 900px) {
  #output { padding: 16px 16px 150px; box-sizing: border-box; }
}

/* ── MOBILE: scrollable page layout ── */
@media (max-width: 768px) {
  /* Full scrollable page */
  html, body { height: auto; overflow: auto; }
  #terminal-wrap { height: auto; min-height: 100dvh; overflow: visible; display: flex; flex-direction: column; }
  #term-body { flex-direction: column; overflow: visible; flex: none; }

  /* Hide terminal output, input, suggestions */
  #output { display: none !important; }
  #input-row { display: none !important; }
  #suggestion-bar { display: none !important; }

  /* Command buttons — 3 per row */
  #command-buttons {
    padding: 0;
    gap: 8px;
  }
  #command-buttons button {
    padding: 10px 14px;
    font-size: 11px;
    min-height: 42px;
    flex: 1 1 calc(33% - 8px);
  }
  #command-buttons button.active {
    background: #161616;
    color: #aaa;
    border-color: #2a2a2a;
  }

  /* Mobile content area — renders below buttons */
  #mobile-content {
    padding: 0 16px 40px;
    min-height: 0;
  }
  #mobile-content .m-section-head {
    color: #b0b0b0;
    font-size: 13px;
    font-weight: 500;
    padding: 18px 0 10px;
    border-bottom: 1px solid #161616;
    margin-bottom: 12px;
    letter-spacing: 0.04em;
  }
  #mobile-content .m-text {
    color: #555;
    font-size: 12px;
    line-height: 1.9;
    margin-bottom: 6px;
  }
  #mobile-content .m-text.bright { color: #e2e2e2; }
  #mobile-content .m-card {
    border: 1px solid #1a1a1a;
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    background: #0b0b0b;
    transition: border-color 0.15s;
  }
  #mobile-content .m-card:active { border-color: #2a2a2a; }
  #mobile-content .m-card-title { color: #b0b0b0; font-size: 13px; font-weight: 500; margin-bottom: 4px; }
  #mobile-content .m-card-meta  { color: #2e2e2e; font-size: 11px; margin-bottom: 6px; }
  #mobile-content .m-card-desc  { color: #555; font-size: 12px; }
  #mobile-content .m-skill-cat  { color: #e2e2e2; font-size: 12px; margin-top: 14px; margin-bottom: 3px; }
  #mobile-content .m-skill-items { color: #444; font-size: 12px; padding-left: 10px; line-height: 1.8; }
  #mobile-content .m-help-row {
    display: flex; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid #111;
    color: #555; font-size: 12px;
  }
  #mobile-content .m-help-row span:first-child { color: #888; }
  #terminal-footer {
    position: relative;
    left: auto; right: auto; bottom: auto;
    padding: 20px 16px 24px;
    display: flex; flex-direction: column; align-items: stretch;
    gap: 18px;
  }
  #footer-right { width: 100%; flex-basis: auto; }
  #input-row { padding-bottom: 10px; }
  #suggestion-bar { position: relative; left: auto; bottom: auto; padding: 0 16px; }
}
@media (max-height: 500px) and (orientation: landscape) {
  #output { display: block !important; padding: 8px 12px; }
  #input-row { display: flex !important; }
  .welcome-ascii { font-size: 6px; white-space: pre !important; overflow-x: auto; min-width: max-content; }
  .line.empty { height: 1.2em; }
}
.welcome-ascii { overflow-x: auto; white-space: pre !important; min-width: max-content; word-break: normal !important; }


/* ── CONTINUOUS MOUNTAIN BACKGROUND ── */
html, body { min-height: 100%; }
body {
  position: relative;
  background: #050608 url('mountains.png') center top / cover fixed no-repeat;
}
body::after { display: none; }
body::before {
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity: 0.035;
  z-index: 9999;
}

/* ── SUBTLE STAR FIELD ── */
/* The whole field drifts together in one consistent direction (like a
   real star-trail time-lapse) rather than stars jittering independently.
   Technique: a 2x2 tile of the SAME star pattern (200% x 200%) slides
   diagonally by exactly one tile's width/height, so the loop point is
   seamless — you never see a jump or reset, just continuous drift.
   Individual stars still twinkle in brightness on top of that shared
   motion, generated in JS (see createStars() in script.js). */
.stars {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: -1;
}

.stars-track {
  position: absolute;
  top: 0; left: 0;
  width: 200%;
  height: 100%;
  animation: skyDrift 100s linear infinite;
  will-change: transform;
}

.stars-tile {
  position: absolute;
  top: 0;
  width: 50%;
  height: 100%;
}

.stars span {
  position: absolute;
  border-radius: 50%;
  background: rgba(245, 245, 235, .9);
  animation-name: starTwinkle;
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
  will-change: opacity;
}

/* the field drifts sideways only — no vertical scroll — so stars never
   cycle down through the lower part of the viewport near the mountains */
@keyframes skyDrift {
  from { transform: translate3d(0, 0, 0); }
  to   { transform: translate3d(-50%, 0, 0); }
}

/* individual stars twinkle in brightness — min/max come from each star's
   inline --peak/--floor custom properties so brightness varies per star */
@keyframes starTwinkle {
  0%, 100% { opacity: var(--floor, .12); }
  50%      { opacity: var(--peak, .85); }
}

/* reduced-motion: freeze the shared drift (continuous panning is the
   kind of motion this preference is meant to avoid) but keep the
   per-star brightness twinkle, which isn't a vestibular trigger */
@media (prefers-reduced-motion: reduce) {
  .stars-track { animation: none; }
}

/* ── LANDING / HERO ── */
#hero {
  min-height: 100svh;
  height: 100svh;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow: hidden;
  isolation: isolate;
}
#hero::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(to bottom,
    rgba(3,4,6,.10) 0%,
    rgba(3,4,6,.12) 48%,
    rgba(3,4,6,.48) 82%,
    rgba(3,4,6,.76) 100%);
}
.hero-inner {
  width: min(760px, 90vw);
  margin-top: -2vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}
@font-face {
  font-family: "Azonix";
  src: url("./fonts/Azonix.otf") format("opentype");
  font-weight: normal;
  font-style: normal;
}

.hero-name {

  font-family: "Azonix", sans-serif;

  font-size: clamp(76px, 10vw, 148px);

  font-weight: 400;

  letter-spacing: .28em;

  padding-left: .28em;

  line-height: .88;

  color: #d8d0bd;

  transform: scaleX(1.04);

  transform-origin: center;

  text-shadow: 0 2px 28px rgba(0,0,0,.55);

  white-space: nowrap;
}
.hero-role {
  margin-top: 20px;
  font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace;
  font-size: 15px;
  font-weight: 300;
  letter-spacing: .27em;
  color: #8d8d8d;
  white-space: nowrap;
}
.hero-rule {
  width: 112px;
  height: 1px;
  margin: 18px auto 0;
  background: rgba(210,210,210,.18);
}
.hero-tagline {
  margin-top: 20px;
  font-size: 25px;
  line-height: 1.9;
  font-weight: 300;
  color: #8b8b8b;
  letter-spacing: .035em;
  text-shadow: 0 1px 12px rgba(0,0,0,.7);
}
.hero-scroll {
  position: absolute;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(205,205,205,.36);
  font-size: 9px;
  letter-spacing: .24em;
  text-transform: uppercase;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.hero-scroll::after {
  content: '';
  width: 1px;
  height: 26px;
  background: linear-gradient(to bottom, rgba(210,210,210,.4), transparent);
}

/* ── TERMINAL BECOMES THE SECOND SCREEN ── */
#terminal-wrap {
  min-height: 100svh;
  height: 100svh;
  background: rgba(5,6,8,.30);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}
#input-row, #command-buttons, #suggestion-bar { background: transparent; }
.card { background: rgba(7,8,10,.62); }

@media (max-width: 700px) {
  .hero-name {
  font-size: clamp(60px, 10vw, 148px);
  letter-spacing: .28em;
  padding-left: .28em;
  transform: scaleX(1.04);
}
  .hero-role { font-size: 8px; letter-spacing: .18em; }
  .hero-tagline { font-size: 10px; max-width: 310px; }
  .hero-scroll { bottom: 20px; }
}

</style>
</head>
<body>

<section id="hero" aria-label="Yash portfolio landing page">
  <div class="stars" id="stars" aria-hidden="true">
    <div class="stars-track" id="stars-track"></div>
  </div>
  <div class="hero-inner">
    <div class="hero-name">YASH</div>
    <div class="hero-role">EMBEDDED/ROBOTICS</div>
    <div class="hero-rule"></div>
    <div class="hero-tagline">Making machines see, feel and act</div>
  </div>
  <div class="hero-scroll" aria-hidden="true">scroll</div>
</section>

<div id="terminal-wrap">
  <div id="term-body">
    <div id="output"></div>
  </div>

  <div id="terminal-footer">
    <div id="footer-left">
      <div id="input-row">
        <span id="prompt-label">yash@portfolio:~$ </span>
        <input id="cmd-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/>
